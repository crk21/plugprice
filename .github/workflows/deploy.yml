name: Fetch, build & deploy
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch AFDC
        env:
          AFDC_API_KEY: ${{ secrets.AFDC_API_KEY || 'DEMO_KEY' }}
        run: python3 fetch.py
      - name: Build site
        run: python3 build.py
      - name: Commit snapshot + history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/latest.json data/history data/leaderboard_latest.json
          if git diff --cached --quiet; then echo "no data changes"; else
            git commit -m "data: snapshot $(date -u +%F) [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
